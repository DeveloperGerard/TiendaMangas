{% extends "base.html" %}
{% block title %}Eliminar {{ manga.titulo }} | HunterForMangas{% endblock %}
{% block content %}
<section class="container py-5">
    <div class="card form-card mx-auto border-danger">
        <div class="card-body p-4">
            <h1 class="h3 fw-bold">Confirmar eliminación</h1>
            <p>¿Seguro que deseas eliminar <strong>{{ manga.titulo }}</strong>? Esta acción no se puede deshacer.</p>
            <form method="post">
                {% csrf_token %}
                <button class="btn btn-danger" type="submit">Sí, eliminar</button>
                <a class="btn btn-outline-secondary" href="{% url 'detalleManga' manga.pk %}">Cancelar</a>
            </form>
        </div>
    </div>
</section>
{% endblock %}
